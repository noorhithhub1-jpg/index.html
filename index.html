<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="مسلسلات وأفلام نور بوكس">
<title>نور بوكس | NOORBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
--bg:#090909;
--surface:#171717;
--surface2:#222;
--text:#fff;
--muted:#aaa;
--red:#e50914;
--red2:#b20710;
--border:#292929;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{
margin:0;min-height:100vh;overflow-x:hidden;
color:var(--text);background:var(--bg);
font-family:"Alexandria",sans-serif
}
body,input,select,button,a{font-family:"Alexandria",sans-serif}
button,input,select{font:inherit}
button{color:inherit}
[hidden]{display:none!important}

/* HEADER */
.top-banner{
position:sticky;top:0;z-index:100;
background:rgba(9,9,9,.96);
border-bottom:1px solid #242424;
box-shadow:0 5px 25px #0008;
backdrop-filter:blur(15px)
}
.banner-inner{
width:min(1100px,94%);min-height:65px;margin:auto;
display:flex;align-items:center;justify-content:space-between;gap:12px
}
.brand{
display:flex;align-items:center;gap:10px;
color:white;text-decoration:none;font-size:19px;font-weight:800
}
.brand-icon{
display:grid;place-items:center;width:37px;height:37px;
color:white;background:var(--red);border-radius:9px
}
.brand-name{color:white}
.brand-name span{color:var(--red)}
.header-actions{display:flex;align-items:center;gap:8px}
.top-home,.nav-link{
padding:9px 12px;color:#eee;background:transparent;
border:1px solid #333;border-radius:8px;font-size:10px;cursor:pointer
}
.top-home:hover,.nav-link:hover{
background:var(--red);border-color:var(--red)
}

/* MAIN */
.container{
width:min(1100px,94%);margin:auto;padding:18px 0 35px
}
.search-wrap{margin:8px 0 23px}
.main-search{
display:flex;align-items:center;gap:12px;
padding:13px 16px;background:#171717;
border:1px solid #333;border-radius:9px
}
.main-search:focus-within{border-color:var(--red)}
.main-search>i{color:var(--red);font-size:17px}
.main-search input{
width:100%;min-width:0;color:white;background:transparent;
border:0;outline:0;font-size:12px
}
.main-search input::placeholder{color:#888}

/* SECTION HEADINGS */
.section-block{margin:25px 0 32px}
.section-heading{
display:flex;align-items:center;justify-content:space-between;
gap:10px;margin-bottom:15px
}
.section-heading h2{
display:flex;align-items:center;gap:10px;
margin:0;font-size:16px;font-weight:800
}
.section-heading h2:before{
content:"";width:4px;height:22px;
background:var(--red);border-radius:5px
}
.section-subtitle{color:#888;font-size:9px}
.toolbar{
display:flex;align-items:center;justify-content:space-between;
gap:10px;margin-bottom:17px
}
.toolbar-side{display:flex;align-items:center;gap:9px}
#countryFilter{
max-width:170px;padding:9px 11px;color:white;
background:#171717;border:1px solid #333;
border-radius:8px;outline:0;font-size:10px
}
#countryFilter option{background:#171717}
.result-count{color:#888;font-size:10px;white-space:nowrap}

/* LATEST EPISODES */
.latest-row{
display:flex;gap:13px;overflow-x:auto;
padding:3px 2px 14px;
scroll-snap-type:x mandatory;
scrollbar-width:thin;scrollbar-color:#555 transparent;
-webkit-overflow-scrolling:touch
}
.latest-card{
flex:0 0 235px;min-width:0;overflow:hidden;
color:white;text-decoration:none;background:#171717;
border:1px solid #292929;border-radius:10px;
scroll-snap-align:start;transition:.2s
}
.latest-image-wrap{
position:relative;aspect-ratio:16/9;overflow:hidden;background:#222
}
.latest-image{
width:100%;height:100%;display:block;object-fit:cover;
transition:transform .3s
}
.latest-overlay{
position:absolute;inset:0;display:grid;place-items:center;
background:#0005
}
.latest-play{
display:grid;place-items:center;width:42px;height:42px;
background:var(--red);border-radius:50%;font-size:14px;
box-shadow:0 3px 20px #0008
}
.latest-info{padding:10px 11px 12px}
.latest-series{color:#aaa;font-size:9px;margin-bottom:5px}
.latest-title{font-size:12px;font-weight:700;line-height:1.8}
.latest-meta{
display:flex;justify-content:space-between;gap:8px;
margin-top:8px;color:#888;font-size:9px
}
.latest-card:hover{border-color:var(--red);transform:translateY(-3px)}
.latest-card:hover .latest-image{transform:scale(1.05)}

/* SERIES - NETFLIX HORIZONTAL ROW */
#results{
display:flex;
flex-wrap:nowrap;
align-items:stretch;
gap:11px;
width:100%;
overflow-x:auto;
overflow-y:hidden;
padding:3px 2px 15px;
scroll-snap-type:x mandatory;
scrollbar-width:thin;
scrollbar-color:#555 transparent;
-webkit-overflow-scrolling:touch;
overscroll-behavior-x:contain
}
#results .card{
flex:0 0 145px;
width:145px;
min-width:0;
scroll-snap-align:start
}

/* POSTER CARDS */
.grid{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:17px 13px
}
.card{
min-width:0;overflow:hidden;cursor:pointer;
background:#171717;border:1px solid #292929;
border-radius:9px;transition:.22s
}
.card-photo-button{
position:relative;display:block;width:100%;
padding:0;border:0;background:#222;overflow:hidden
}
.photo{
display:block;width:100%;aspect-ratio:2/3;
object-fit:cover;background:#222;transition:.3s
}
.photo-placeholder{
display:grid;place-items:center;color:#fff;
font-size:30px;font-weight:800;
background:linear-gradient(145deg,#333,#111)
}
.poster-overlay{
position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;
background:linear-gradient(0deg,#000b,transparent 70%);
opacity:0;transition:.2s
}
.poster-overlay span{
display:grid;place-items:center;width:42px;height:42px;
color:white;background:var(--red);border-radius:50%
}
.card-info{padding:9px 10px 11px}
.name-ar{
margin:0;color:#fff;font-size:11px;font-weight:800;
line-height:1.9;overflow-wrap:anywhere
}
.name-en{
direction:ltr;text-align:right;margin-top:3px;
color:#999;font:10px Arial,sans-serif;overflow-wrap:anywhere
}
.card-meta{
display:flex;align-items:center;justify-content:space-between;
gap:5px;margin-top:9px;padding-top:8px;
border-top:1px solid #303030
}
.country-badge{
max-width:65%;padding:4px 6px;color:#ddd;
background:#292929;border-radius:5px;
font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.card-hint{color:#aaa;font-size:8px}
.card:hover{border-color:#777;transform:translateY(-3px)}
.card:hover .photo{transform:scale(1.04);filter:brightness(.75)}
.card:hover .poster-overlay{opacity:1}
.card:active{transform:scale(.98)}

/* EMPTY */
.empty{
grid-column:1/-1;
flex:1 0 100%;
padding:30px 15px;text-align:center;
background:#171717;border:1px solid #292929;border-radius:10px
}
.empty i{color:var(--red);font-size:25px}
.empty h3{margin:12px 0 6px;font-size:14px}
.empty p{margin:0;color:#999;font-size:10px;line-height:2}

/* MORE */
.more-wrap{display:flex;justify-content:center;padding:18px 0}
.more-btn{
min-width:150px;padding:11px 18px;color:white;
background:var(--red);border:0;border-radius:7px;
font-size:11px;font-weight:700;cursor:pointer
}
.more-btn:hover{background:var(--red2)}

/* MOVIES */
.movie-label{color:var(--red)}

/* FOOTER */
footer{
padding:24px 15px 30px;text-align:center;
color:#888;border-top:1px solid #292929;
font-size:10px;line-height:2.3
}
.footer-brand{color:white;font-size:14px;font-weight:800}
.footer-brand span{color:var(--red)}

/* BACK TOP */
.back-top{
position:fixed;z-index:90;left:15px;bottom:17px;
display:grid;place-items:center;width:42px;height:42px;
color:white;background:var(--red);border:0;border-radius:9px;
opacity:0;visibility:hidden;transform:translateY(8px);
transition:.2s;cursor:pointer
}
.back-top.visible{opacity:1;visibility:visible;transform:none}

/* EPISODES PAGE */
.episodes-view{
min-height:calc(100vh - 65px);padding:0 0 35px;
background:#090909
}
.episodes-container{width:min(1050px,94%);margin:auto}
.episodes-nav{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:17px 0
}
.back-library{
display:inline-flex;align-items:center;gap:8px;
padding:10px 13px;color:white;background:#222;
border:1px solid #444;border-radius:7px;font-size:10px;cursor:pointer
}
.episodes-kicker{color:var(--red);font-size:10px;font-weight:800}
.series-hero{
position:relative;display:grid;grid-template-columns:155px 1fr;
align-items:center;gap:20px;padding:18px;
background:linear-gradient(120deg,#242424,#111);
border:1px solid #333;border-radius:12px;overflow:hidden
}
.hero-poster{
width:100%;aspect-ratio:2/3;object-fit:cover;
border-radius:8px;background:#222
}
.hero-copy{min-width:0}
.hero-label{
display:inline-block;padding:6px 9px;color:white;
background:var(--red);border-radius:5px;font-size:9px
}
.hero-title{
margin:12px 0 4px;color:white;
font-size:clamp(19px,4vw,28px);line-height:1.6
}
.hero-original{direction:ltr;text-align:right;color:#aaa;font:13px Arial}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.meta-chip{
padding:7px 9px;color:#ddd;background:#222;
border:1px solid #444;border-radius:6px;font-size:9px
}
.hero-description{margin:12px 0 0;color:#aaa;font-size:10px;line-height:2}
.episodes-heading{
display:flex;align-items:center;justify-content:space-between;
gap:10px;margin:25px 0 14px
}
.episodes-heading h2{margin:0;font-size:15px}
.episodes-heading h2 i{color:var(--red)}
.season-select{
max-width:150px;padding:9px 11px;color:white;
background:#171717;border:1px solid #444;border-radius:7px;font-size:10px
}
.season-select option{background:#171717}
.episodes-grid{
display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px
}
.episode-card{
display:flex;align-items:center;gap:11px;min-width:0;
padding:9px;color:white;text-decoration:none;
background:#171717;border:1px solid #303030;
border-radius:9px;transition:.2s
}
.episode-card:hover{border-color:var(--red);transform:translateY(-2px)}
.episode-thumb-wrap{
position:relative;flex:0 0 125px;width:125px;
aspect-ratio:16/10;overflow:hidden;border-radius:6px;background:#222
}
.episode-thumb{width:100%;height:100%;display:block;object-fit:cover}
.episode-play{
position:absolute;inset:0;display:grid;place-items:center;
background:#0005
}
.episode-play i{
display:grid;place-items:center;width:33px;height:33px;
padding-right:2px;background:var(--red);border-radius:50%;font-size:11px
}
.episode-copy{flex:1;min-width:0}
.episode-number{margin:0;font-size:11px;line-height:1.8}
.episode-season{margin-top:4px;color:#999;font-size:8px}
.episode-foot{
display:flex;justify-content:space-between;gap:5px;
margin-top:8px;color:#aaa;font-size:8px
}
.episode-heart{color:var(--red)}
.episode-watch{color:#ddd}
.no-episodes{
grid-column:1/-1;padding:28px 15px;text-align:center;
background:#171717;border:1px dashed #444;border-radius:10px
}
.no-episodes i{color:var(--red);font-size:25px}
.no-episodes h3{font-size:13px}
.no-episodes p{color:#999;font-size:10px;line-height:2}
.episodes-footer{
margin-top:30px;padding:18px;text-align:center;
color:#888;border-top:1px solid #292929;font-size:10px
}

/* TABLET */
@media(max-width:800px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.episodes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#results .card{flex-basis:130px;width:130px}
}

/* MOBILE */
@media(max-width:600px){
.banner-inner{min-height:58px}
.brand{font-size:15px}
.brand-icon{width:33px;height:33px}
.top-home{font-size:9px;padding:8px 10px}
.container{padding-top:12px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px}
.card-info{padding:8px}
.name-ar{font-size:10px}
.name-en{font-size:9px}
.latest-card{flex-basis:205px}
#results{gap:9px;padding-bottom:13px}
#results .card{flex:0 0 112px;width:112px}
.series-hero{grid-template-columns:105px 1fr;gap:13px;padding:12px}
.hero-title{font-size:18px}
.hero-description{font-size:9px}
.episode-card{gap:8px;padding:7px}
.episode-thumb-wrap{flex-basis:100px;width:100px}
.episode-number{font-size:9px}
}

/* SMALL MOBILE */
@media(max-width:390px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .episodes-grid{grid-template-columns:1fr}
 .episode-thumb-wrap{flex-basis:125px;width:125px}

 .series-hero{
  grid-template-columns:65px 1fr;
  gap:9px;
  padding:9px;
 }

 .hero-poster{
  display:block;
  width:65px;
  aspect-ratio:2/3;
  object-fit:cover;
 }
}

/* =================================
   NOORBOX - PROFESSIONAL LAYOUT
================================= */

/* ترتيب الأقسام وتباعدها */
.container{
 display:flex;
 flex-direction:column;
 gap:34px;
 padding-top:22px;
 padding-bottom:45px;
}

.search-wrap{
 margin:0;
}

.section-block{
 width:100%;
 margin:0;
 padding:0 0 30px;
 border-bottom:1px solid #252525;
 position:relative;
}

.section-block:last-child{
 border-bottom:0;
 padding-bottom:0;
}

/* عناوين الأقسام */
.section-heading{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 margin-bottom:19px;
}

.section-heading h2{
 font-size:17px;
 letter-spacing:-.3px;
}

.section-heading h2:before{
 width:4px;
 height:24px;
 border-radius:10px;
 box-shadow:0 0 12px #e5091466;
}

.section-subtitle{
 color:#888;
 font-size:10px;
}

/* كروت آخر الحلقات */
.latest-row{
 gap:15px;
 padding:5px 3px 17px;
}

.latest-card{
 flex:0 0 240px;
 background:linear-gradient(145deg,#1c1c1c,#111);
 border:1px solid #303030;
 border-radius:12px;
 box-shadow:0 5px 18px #0005;
}

.latest-image-wrap{
 border-bottom:1px solid #303030;
}

.latest-info{
 padding:12px;
}

.latest-title{
 font-size:12px;
 line-height:1.9;
}

.latest-card:hover{
 border-color:#e50914;
 box-shadow:0 8px 25px #e5091420;
}

/* كروت المسلسلات الأفقية */
#results{
 gap:14px;
 padding:5px 3px 18px;
 scrollbar-width:thin;
}

#results .card{
 flex:0 0 150px;
 width:150px;
 border-radius:12px;
 background:linear-gradient(160deg,#1c1c1c,#111);
 border:1px solid #303030;
 box-shadow:0 5px 16px #0005;
}

#results .photo{
 aspect-ratio:2/3;
 border-radius:0;
}

#results .card-info{
 padding:11px 10px 12px;
}

#results .name-ar{
 font-size:11px;
 line-height:1.9;
 min-height:21px;
}

#results .name-en{
 font-size:10px;
 color:#999;
}

#results .card-meta{
 margin-top:10px;
 padding-top:9px;
 border-color:#333;
}

#results .card:hover{
 border-color:#e50914;
 transform:translateY(-4px);
 box-shadow:0 9px 24px #e5091420;
}

/* كروت الأفلام */
#moviesResults{
 gap:18px 14px;
}

#moviesResults .card{
 border-radius:12px;
 background:linear-gradient(160deg,#1c1c1c,#111);
 border:1px solid #303030;
 box-shadow:0 5px 16px #0005;
}

#moviesResults .photo{
 aspect-ratio:2/3;
}

#moviesResults .card-info{
 padding:11px 10px 12px;
}

#moviesResults .name-ar{
 font-size:12px;
 line-height:1.9;
}

#moviesResults .name-en{
 font-size:10px;
}

#moviesResults .card-meta{
 border-color:#333;
}

#moviesResults .card:hover{
 border-color:#e50914;
 transform:translateY(-4px);
 box-shadow:0 9px 24px #e5091420;
}

/* تحسين الصور والتأثيرات */
.card-photo-button{
 background:#202020;
}

.photo{
 transition:transform .35s ease,filter .35s ease;
}

.poster-overlay{
 background:linear-gradient(
  0deg,
  #000d 0%,
  #0005 45%,
  transparent 100%
 );
}

.poster-overlay span{
 box-shadow:0 4px 18px #0009;
}

/* شكل معلومات الكروت */
.country-badge{
 background:#292929;
 border:1px solid #383838;
}

.card-hint{
 white-space:nowrap;
}

/* زر عرض المزيد */
.more-wrap{
 padding:23px 0 0;
}

.more-btn{
 border-radius:9px;
 box-shadow:0 5px 18px #e5091425;
 transition:.2s;
}

.more-btn:active{
 transform:scale(.97);
}

/* شريط التمرير */
.latest-row::-webkit-scrollbar,
#results::-webkit-scrollbar{
 height:5px;
}

.latest-row::-webkit-scrollbar-thumb,
#results::-webkit-scrollbar-thumb{
 background:#444;
 border-radius:20px;
}

/* الهاتف */
@media(max-width:600px){

 .container{
  gap:29px;
  padding-top:17px;
  padding-bottom:35px;
 }

 .section-block{
  padding-bottom:25px;
 }

 .section-heading{
  margin-bottom:16px;
 }

 .section-heading h2{
  font-size:15px;
 }

 .latest-row{
  gap:12px;
 }

 .latest-card{
  flex-basis:215px;
  border-radius:11px;
 }

 #results{
  gap:12px;
  padding-bottom:16px;
 }

 #results .card{
  flex:0 0 130px;
  width:130px;
  border-radius:11px;
 }

 #results .card-info{
  padding:9px;
 }

 #moviesResults{
  gap:14px 10px;
 }

 #moviesResults .card{
  border-radius:10px;
 }

 #moviesResults .card-info{
  padding:9px;
 }

}

/* الشاشات الصغيرة جداً */
@media(max-width:390px){

 .container{
  gap:25px;
 }

 #results .card{
  flex-basis:122px;
  width:122px;
 }

 .latest-card{
  flex-basis:205px;
 }

 #moviesResults{
  gap:12px 9px;
 }

}

/* تقليل الحركة */
@media(prefers-reduced-motion:reduce){
 .card,.latest-card,.photo{
  transition:none!important;
 }
}
/* SMART SEARCH */
.smart-search-page{
 display:none;
 min-height:55vh;
 padding:8px 0 35px;
}

.smart-search-page.active{
 display:block;
}

.smart-search-heading{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:20px;
}

.smart-search-heading h2{
 margin:0;
 font-size:17px;
 font-weight:800;
}

.smart-search-heading h2 i{
 color:var(--red);
 margin-left:7px;
}

.smart-search-results{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:18px 13px;
}

.smart-search-results .card{
 animation:searchAppear .25s ease both;
}

.search-type{
 color:#999;
 font-size:10px;
 margin-top:5px;
}

.smart-search-empty{
 padding:45px 15px;
 text-align:center;
 background:#171717;
 border:1px solid #292929;
 border-radius:12px;
}

.smart-search-empty i{
 color:var(--red);
 font-size:32px;
 margin-bottom:13px;
}

.smart-search-empty h3{
 font-size:14px;
 margin:8px 0;
}

.smart-search-empty p{
 color:#999;
 font-size:10px;
}

@keyframes searchAppear{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}

@media(max-width:800px){
 .smart-search-results{
  grid-template-columns:repeat(4,minmax(0,1fr));
 }
}

@media(max-width:600px){
 .smart-search-results{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px 9px;
 }
}

@media(max-width:390px){
 .smart-search-results{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }
}
/* NOORBOX FLOATING AD */
#floatingBanner {
  position: fixed;
  right: 10px;
  bottom: 80px;
  width: 320px;
  height: 50px;
  z-index: 99999;
  background: #fff;

/* أضف أفلامك هنا */
const movies=[];

const $=id=>document.getElementById(id);
let currentQuery="";
let visibleCount=PAGE_SIZE;
let currentSeries=null;
let previousScroll=0;

const libraryPage=$("libraryPage");
const episodesPage=$("episodesPage");
const libraryFooter=$("libraryFooter");

function makeElement(tag,cls="",text){
 const el=document.createElement(tag);
 if(cls)el.className=cls;
 if(text!==undefined)el.textContent=text;
 return el;
}

function safeUrl(value){
 if(!value)return "";
 try{
  const u=new URL(String(value).trim());
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch(e){return ""}
}

function normalize(value){
 return String(value||"").normalize("NFKC").toLocaleLowerCase()
 .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
 .replace(/[ًٌٍَُِّْـ]/g,"")
 .replace(/[^\p{L}\p{N}\s]/gu," ")
 .replace(/\s+/g," ").trim();
}

function photoNode(url,cls,fallbackText,alt){
 const safe=safeUrl(url);
 if(!safe){
  const d=makeElement("div",cls+" photo-placeholder",fallbackText||"؟");
  d.setAttribute("role","img");
  d.setAttribute("aria-label",alt||"صورة غير متاحة");
  return d;
 }
 const img=makeElement("img",cls);
 img.src=safe;img.alt=alt||"صورة";
 img.loading="lazy";img.decoding="async";
 img.referrerPolicy="no-referrer";
 img.addEventListener("error",()=>{
  if(img.isConnected){
   const d=makeElement("div",cls+" photo-placeholder",fallbackText||"؟");
   img.replaceWith(d);
  }
 },{once:true});
 return img;
}

function episodeCount(series){
 return (series.episodes||[]).filter(e=>safeUrl(e.link)).length;
}

/* البحث */
function matchesSearch(item){
 const words=normalize(currentQuery).split(" ").filter(Boolean);
 if(!words.length)return true;
 const hay=normalize([
  item.nameAr,item.nameEn,item.country,
  ...(item.aliases||[]),...(item.tags||[]),
  ...(item.episodes||[]).map(e=>e.title)
 ].join(" "));
 return words.every(w=>hay.includes(w));
}

function fillCountries(){
 const select=$("countryFilter");
 const old=select.value;
 select.replaceChildren(new Option("كل الدول",""));
 [...new Set(actors.map(a=>a.country).filter(Boolean))]
 .sort((a,b)=>a.localeCompare(b,"ar"))
 .forEach(c=>select.add(new Option(c,c)));
 if([...select.options].some(o=>o.value===old))select.value=old;
}

/* كرت المسلسل */
function createCard(actor,index){
 const card=makeElement("article","card");
 card.tabIndex=0;
 card.setAttribute("role","button");
 card.setAttribute("aria-label","عرض حلقات "+actor.nameAr);
 card.style.animationDelay=Math.min(index*25,200)+"ms";

 const photo=makeElement("div","card-photo-button");
 photo.appendChild(photoNode(actor.image,"photo",actor.initials,actor.nameAr));
 const overlay=makeElement("div","poster-overlay");
 const play=makeElement("span");
 play.innerHTML='<i class="fa-solid fa-play"></i>';
 overlay.appendChild(play);
 photo.appendChild(overlay);

 const info=makeElement("div","card-info");
 info.appendChild(makeElement("h3","name-ar",actor.nameAr||actor.nameEn));
 info.appendChild(makeElement("div","name-en",actor.nameEn||""));

 const meta=makeElement("div","card-meta");
 meta.appendChild(makeElement("span","country-badge",actor.country||"مسلسل"));
 meta.appendChild(makeElement("span","card-hint",episodeCount(actor)+" حلقة"));
 info.appendChild(meta);

 card.append(photo,info);
 const open=()=>openEpisodes(actor);
 card.addEventListener("click",open);
 card.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}
 });
 return card;
}

/* كرت الفيلم */
function createMovieCard(movie,index){
 const card=makeElement("article","card");
 card.tabIndex=0;
 card.setAttribute("role","link");

 const photo=makeElement("div","card-photo-button");
 photo.appendChild(photoNode(movie.image,"photo",movie.initials||"ف",movie.nameAr));
 const overlay=makeElement("div","poster-overlay");
 const play=makeElement("span");
 play.innerHTML='<i class="fa-solid fa-play"></i>';
 overlay.appendChild(play);
 photo.appendChild(overlay);

 const info=makeElement("div","card-info");
 info.appendChild(makeElement("h3","name-ar",movie.nameAr||movie.nameEn));
 info.appendChild(makeElement("div","name-en",movie.nameEn||""));
 const meta=makeElement("div","card-meta");
 meta.appendChild(makeElement("span","country-badge",movie.country||"فيلم"));
 meta.appendChild(makeElement("span","card-hint","مشاهدة الفيلم"));
 info.appendChild(meta);
 card.append(photo,info);

 const open=()=>{
  const url=safeUrl(movie.link);
  if(url)window.open(url,"_blank","noopener,noreferrer");
 };
 card.addEventListener("click",open);
 card.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}
 });
 return card;
}

/* آخر الحلقات */

function renderLatest(){
 const target=$("latestEpisodes");
 target.replaceChildren();

 const latest=[];

 actors.forEach(series => {
  [...(series.episodes || [])].reverse().forEach(ep => {
    const link = safeUrl(ep.link);
    if (!link) return;
    latest.push({ series, ep, link });
  });
});

 if(!latest.length){
  const empty=makeElement("div","empty");
  empty.style.minWidth="100%";
  empty.append(
   makeElement("i","fa-solid fa-clapperboard"),
   makeElement("h3","","لا توجد حلقات مضافة"),
   makeElement("p","","ستظهر أحدث الحلقات هنا عند إضافتها إلى المسلسلات.")
  );
  target.appendChild(empty);
  return;
 }

 // عرض 12 حلقة في كل مرة
 const visible=latest.slice(0,latestVisibleCount);

 visible.forEach(({series,ep,link})=>{
  const card=makeElement("a","latest-card");
  card.href=link;
  card.target="_blank";
  card.rel="noopener noreferrer";

  let adShown=false;

  card.addEventListener("click",function(e){
   if(!adShown){
    e.preventDefault();
    adShown=true;
    openPlayAd();
   }
  });

  const imageWrap=makeElement("div","latest-image-wrap");

  imageWrap.appendChild(photoNode(
   ep.image||series.image,
   "latest-image",
   series.initials,
   "صورة الحلقة"
  ));

  const overlay=makeElement("div","latest-overlay");
  const play=makeElement("span","latest-play");
  play.innerHTML='<i class="fa-solid fa-play"></i>';
  overlay.appendChild(play);
  imageWrap.appendChild(overlay);

  const info=makeElement("div","latest-info");
  info.appendChild(makeElement("div","latest-series",series.nameAr));
  info.appendChild(makeElement("div","latest-title",ep.title||"الحلقة "+ep.number));

  const meta=makeElement("div","latest-meta");
  meta.appendChild(makeElement("span","","الموسم "+(ep.season||1)));
  meta.appendChild(makeElement("span","","مشاهدة الحلقة ←"));
  info.appendChild(meta);

  card.append(imageWrap,info);
  target.appendChild(card);
 });

 // كرت عرض المزيد في نهاية الحلقات
 if(latestVisibleCount<latest.length){
  const remaining=latest.length-latestVisibleCount;

  const more=makeElement("button","latest-more-card");
  more.type="button";

  more.append(
   makeElement("i","fa-solid fa-plus"),
   makeElement("span","","عرض المزيد"),
   makeElement("small","","+"+Math.min(12,remaining)+" حلقة")
  );

  more.addEventListener("click",()=>{
   latestVisibleCount+=12;
   renderLatest();
  });

  target.appendChild(more);
 }
}


/* عرض المسلسلات */
function renderLibrary(){
 const country=$("countryFilter").value;
 const list=actors.filter(a=>
  matchesSearch(a)&&(!country||a.country===country)
 );
 const target=$("results");
 target.replaceChildren();
 $("count").textContent=list.length+" مسلسل";

 if(!list.length){
  const empty=makeElement("div","empty");
  empty.append(
   makeElement("i","fa-solid fa-magnifying-glass"),
   makeElement("h3","","ما لقينا نتائج"),
   makeElement("p","","جرّب اسماً آخر أو اختَر دولة مختلفة.")
  );
  target.appendChild(empty);
  $("showMore").hidden=true;
  return;
 }

 const frag=document.createDocumentFragment();
 list.slice(0,visibleCount).forEach((a,i)=>{
  frag.appendChild(createCard(a,i));
 });
 target.appendChild(frag);

 const remaining=list.length-Math.min(visibleCount,list.length);
 $("showMore").hidden=remaining<=0;
 $("showMore").textContent="عرض المزيد + ("+Math.min(PAGE_SIZE,remaining)+")";
}
/* البحث الذكي الموحد */
function renderSmartSearch() {
  const page = $("smartSearchPage");
  const results = $("smartSearchResults");
  const query = normalize(currentQuery);
  
  const searching = query.length > 0;
  
  $("latestSection").hidden = searching;
  $("seriesSection").hidden = searching;
  $("moviesSection").hidden = searching;
  
  page.classList.toggle("active", searching);
  
  if (!searching) {
    results.replaceChildren();
    return;
  }
  
  results.replaceChildren();
  
  const seriesList = actors.filter(matchesSearch);
  const movieList = movies.filter(matchesSearch);
  
  const total = seriesList.length + movieList.length;
  
  $("smartSearchCount").textContent = total + " نتيجة";
  
  if (!total) {
    const empty = makeElement("div", "smart-search-empty");
    empty.style.gridColumn = "1/-1";
    
    empty.append(
      makeElement("i", "fa-solid fa-magnifying-glass"),
      makeElement("h3", "", "لم نعثر على نتائج"),
      makeElement("p", "", "جرّب البحث باسم آخر أو بكلمات مختلفة.")
    );
    
    results.appendChild(empty);
    return;
  }
  
  seriesList.forEach((item, index) => {
    results.appendChild(createCard(item, index));
  });
  
  movieList.forEach((item, index) => {
    results.appendChild(createMovieCard(item, index));
  });
}

 list.forEach((movie,i)=>target.appendChild(createMovieCard(movie,i)));
}

  previousScroll = window.scrollY;
  
  $("heroTitle").textContent = series.nameAr || series.nameEn || "المسلسل";
  $("heroOriginal").textContent = series.nameEn || "";
  $("heroCountry").textContent = series.country || "غير محدد";
  $("heroDescription").textContent = series.description || "اختر الحلقة التي تريد مشاهدتها.";
  $("heroEpisodeCount").textContent = episodeCount(series) + " حلقة متاحة";
  
  const hero = $("heroPoster");
  const image = safeUrl(series.image);
  
  hero.onerror = () => {
    hero.onerror = null;
    hero.removeAttribute("src");
    hero.style.visibility = "visible";
    hero.alt = "صورة المسلسل غير متاحة";
  };
  
  hero.onload = () => {
    hero.style.visibility = "visible";
  };
  
  hero.style.visibility = "visible";
  
  if (image) {
    hero.src = image;
  } else {
    hero.removeAttribute("src");
    hero.style.visibility = "visible";
  }
  
  renderEpisodes();
  
  libraryPage.hidden = true;
  libraryFooter.hidden = true;
  episodesPage.hidden = false;
  
  $("backTop").classList.remove("visible");
  
  window.scrollTo({ top: 0, behavior: "instant" });
  history.pushState({ page: "episodes" }, "", "#episodes");
}

function renderEpisodes() {
  const series = currentSeries;
  const grid = $("episodesGrid");
  const seasonSelect = $("seasonFilter");
  
  grid.replaceChildren();
  
  const episodes = (series.episodes || []).filter(e => safeUrl(e.link));
  
  const seasons = [...new Set(
    episodes.map(e => Number(e.season) || 1)
  )].sort((a, b) => a - b);
  
  const previous = seasonSelect.value;
  seasonSelect.replaceChildren();
  
  if (!seasons.length) {
    seasonSelect.add(new Option("الموسم 1", "1"));
    
    const empty = makeElement("div", "no-episodes");
    
    empty.append(
      makeElement("i", "fa-solid fa-film"),
      makeElement("h3", "", "الحلقات قيد الإضافة"),
      makeElement("p", "", "لم تتم إضافة حلقات لهذا المسلسل بعد.")
    );
    
    grid.appendChild(empty);
    return;
  }
  
  seasons.forEach(s => {
    seasonSelect.add(new Option("الموسم " + s, String(s)));
  });
  
  if (seasons.includes(Number(previous))) {
    seasonSelect.value = previous;
  }
  
  const selected = Number(seasonSelect.value) || seasons[0];
  
  episodes
    .filter(e => (Number(e.season) || 1) === selected)
    .sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0))
    .forEach(ep => {
      const link = safeUrl(ep.link);
      if (!link) return;
      
      const card = makeElement("a", "episode-card");
      
      card.href = link;
card.target = "_blank";
card.rel = "noopener noreferrer";

let adShown = false;

card.addEventListener("click", function(e) {
  if (!adShown) {
    e.preventDefault();
    adShown = true;
    openPlayAd();
    return;
  }
  
  // الضغطة الثانية تفتح رابط الحلقة مباشرة
});
      
      const thumb = makeElement("div", "episode-thumb-wrap");
      
      const image = safeUrl(ep.image) || safeUrl(series.image);
      
      thumb.appendChild(
        photoNode(image, "episode-thumb", series.initials, "صورة الحلقة")
      );
      
      const play = makeElement("span", "episode-play");
      play.innerHTML = '<i class="fa-solid fa-play"></i>';
      
      thumb.appendChild(play);
      
      const copy = makeElement("div", "episode-copy");
      const number = Number(ep.number) || 1;
      
      copy.append(
        makeElement("h3", "episode-number", ep.title || "الحلقة " + number),
        makeElement(
          "div",
          "episode-season",
          "الموسم " + (Number(ep.season) || 1) + " · الحلقة " + number
        )
      );
      
      const foot = makeElement("div", "episode-foot");
      
      foot.append(
        makeElement("span", "episode-heart", "●"),
        makeElement("span", "episode-watch", "مشاهدة ←")
      );
      
      copy.appendChild(foot);
      
      card.append(thumb, copy);
      grid.appendChild(card);
    });
}

function backToLibrary(fromPop = false) {
  if (episodesPage.hidden) return;
  
  episodesPage.hidden = true;
  libraryPage.hidden = false;
  libraryFooter.hidden = false;
  
  currentSeries = null;
  
  window.scrollTo({
    top: previousScroll,
    behavior: "instant"
  });
  
  if (!fromPop && location.hash === "#episodes") {
    history.back();
  }
}
