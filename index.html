
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090710">
  <meta name="description" content="رورو الحلوة - دليل تفاعلي">
  <title>رورو الحلوة 🎀</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #090710;
      --surface: #15111e;
      --surface2: #20172c;
      --text: #faf6ff;
      --muted: #a69ab5;
      --purple: #b18aff;
      --pink: #f0a3ed;
      --border: #382746;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -15%, #2c1740 0, transparent 48%),
        var(--bg);
      font-family: "Alexandria", sans-serif;
    }

    body, input, select, button, a {
      font-family: "Alexandria", sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button { color: inherit; }

    ::selection {
      color: #fff;
      background: #8e54ca;
    }

    [hidden] { display: none !important; }

    /* الخلفية المتحركة */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      contain: strict;
    }

    .particle {
      position: absolute;
      bottom: -25px;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 9px var(--particle-color);
      opacity: 0;
      animation: rise var(--duration) linear var(--delay) infinite;
    }

    @keyframes rise {
      0% {
        transform: translate3d(0, 0, 0) scale(.6);
        opacity: 0;
      }
      12%, 75% { opacity: var(--opacity); }
      100% {
        transform: translate3d(var(--drift), -115vh, 0) scale(1.2);
        opacity: 0;
      }
    }

    /* الشريط العلوي */
    .top-banner {
      position: fixed;
      z-index: 100;
      top: 0;
      right: 0;
      left: 0;
      padding: 11px 0;
      background: rgba(12, 8, 20, .92);
      border-bottom: 1px solid #3b294c;
      box-shadow: 0 8px 30px #0003;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .banner-inner {
      width: min(1000px, 92%);
      min-height: 39px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #fff;
      text-decoration: none;
      font-size: clamp(18px, 4vw, 25px);
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-heart {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      color: #ffd5fb;
      background: linear-gradient(145deg, #6b3d8c, #291633);
      border: 1px solid #a56ec5;
      border-radius: 13px;
      animation: heartGlow 2.8s ease-in-out infinite;
    }

    @keyframes heartGlow {
      0%, 100% { box-shadow: 0 0 15px #c084fc22; }
      50% { box-shadow: 0 0 25px #c084fc55; }
    }

    .brand-name {
      color: #e9ccff;
      background: linear-gradient(100deg, #fff 10%, #e4c8ff 55%, #f3a8e9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* المحتوى */
    .container {
      position: relative;
      z-index: 1;
      width: min(1000px, 92%);
      margin: 0 auto;
      padding-top: 84px;
    }

    .search-wrap { margin: 14px 0 20px; }

    .main-search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: rgba(22, 17, 31, .94);
      border: 1px solid #3b2b4b;
      border-radius: 14px;
      box-shadow: 0 8px 28px #0002;
      transition: border-color .25s, box-shadow .25s;
    }

    .main-search:focus-within {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px #b18aff12;
    }

    .main-search > i {
      color: var(--purple);
      font-size: 18px;
    }

    .main-search input {
      width: 100%;
      min-width: 0;
      padding: 0;
      color: #fff;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 12px;
    }

    .main-search input::placeholder { color: #9588a4; }

    /* شريط التصفية */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #eee5fb;
      font-size: 13px;
      font-weight: 700;
    }

    .section-label i { color: var(--pink); }

    .toolbar-side {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #countryFilter {
      max-width: 190px;
      padding: 8px 11px;
      color: #e6d9f6;
      background: #171321;
      border: 1px solid #392b48;
      border-radius: 10px;
      outline: 0;
      font-size: 10px;
    }

    .result-count {
      color: #b4a5c5;
      font-size: 10px;
      white-space: nowrap;
    }

    /* الكروت */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px 17px;
      padding-bottom: 20px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(155deg, #191322, #100d17);
      border: 1px solid #30233d;
      border-radius: 16px;
      box-shadow: 0 8px 22px #0002;
      animation: cardEnter .4s ease both;
      transition: border-color .25s, transform .25s, box-shadow .25s;
      outline: none;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 3px;
    }

    .card-photo-button {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #171220;
    }

    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center;
      background: #171220;
      transition: transform .4s, filter .3s;
    }

    .photo-placeholder {
      display: grid;
      place-items: center;
      color: #e2c8ff;
      font-size: 36px;
      font-weight: 800;
      background: radial-gradient(ellipse at 50% 35%, #39234d, #171220 70%);
    }

    .card-photo-button::after {
      content: "CLICK  ✦";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font: 800 12px Arial, sans-serif;
      letter-spacing: 3px;
      background: linear-gradient(0deg, #170b28a8, #10081922);
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
    }

    .card-info { padding: 12px 12px 14px; }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }

    .name-ar {
      min-width: 0;
      margin: 0;
      color: #f8f4ff;
      font-size: 13px;
      line-height: 1.9;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .country-badge {
      flex: 0 1 auto;
      max-width: 52%;
      padding: 4px 7px;
      color: #e6d2ff;
      background: linear-gradient(135deg, #30203f, #1b1425);
      border: 1px solid #4a345e;
      border-radius: 8px;
      font-size: 9px;
      line-height: 1.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .name-en {
      direction: ltr;
      text-align: right;
      margin-top: 3px;
      color: #a69ab5;
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid #30243a;
    }

    .details-hint { color: #a99ab8; font-size: 9px; }

    .details-icon {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      color: var(--pink);
      background: #2a1b36;
      border: 1px solid #503660;
      border-radius: 9px;
      transition: transform .25s, background .25s;
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        transform: translateY(-5px);
        border-color: #8d62b4;
        box-shadow: 0 14px 34px #0004, 0 0 20px #b18aff12;
      }

      .card:hover .photo {
        transform: scale(1.04);
        filter: brightness(.75) saturate(1.12);
      }

      .card:hover .card-photo-button::after { opacity: 1; }
      .card:hover .name-ar { color: var(--pink); }

      .card:hover .details-icon {
        transform: translateX(-2px);
        background: #48305c;
      }
    }

    .card:active { transform: scale(.985); }

    /* عرض المزيد */
    .more-wrap {
      display: flex;
      justify-content: center;
      padding: 4px 0 38px;
    }

    .more-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 165px;
      min-height: 45px;
      padding: 11px 22px;
      color: #fff;
      background: linear-gradient(110deg, #7950c9, #b06fe8);
      border: 1px solid #c09aff;
      border-radius: 13px;
      box-shadow: 0 7px 24px #8b5cf626;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .more-btn:active { transform: scale(.97); }

    /* لا توجد نتائج */
    .empty {
      grid-column: 1 / -1;
      padding: 35px 18px;
      text-align: center;
      background: linear-gradient(145deg, #191322, #100d17);
      border: 1px solid #382744;
      border-radius: 17px;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      color: var(--pink);
      background: #281c35;
      border: 1px solid #493358;
      border-radius: 19px;
      font-size: 22px;
    }

    .empty h2 { margin: 0 0 8px; font-size: 17px; }

    .empty p {
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 2.1;
    }

    .request-btn, .open-link-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 10px 17px;
      color: #fff;
      background: linear-gradient(110deg, #7950c9, #b06fe8);
      border: 1px solid #c09aff;
      border-radius: 11px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* نافذة التفاصيل */
    .modal {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #05030bd9;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-panel {
      position: relative;
      width: min(390px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
      background: linear-gradient(155deg, #21162e, #100d18 80%);
      border: 1px solid #694987;
      border-radius: 21px;
      box-shadow: 0 25px 90px #0009, 0 0 35px #b18aff16;
      transform: translateY(14px) scale(.97);
      transition: transform .3s;
    }

    .modal.open .modal-panel { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      color: #fff;
      background: #100b19e8;
      border: 1px solid #624477;
      border-radius: 11px;
      cursor: pointer;
    }

    .modal-photo-wrap {
      position: relative;
      width: 48%;
      max-width: 155px;
      margin: 0 auto;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #171220;
      border: 1px solid #503661;
      border-radius: 12px;
    }

    .modal-photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #110d18;
    }

    .modal-photo-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: #e2c8ff;
      font-size: 40px;
      font-weight: 800;
      background: radial-gradient(ellipse at 50% 35%, #39234d, #171220 70%);
    }

    .modal-heart {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      color: #ffd8fa;
      background: #271633e8;
      border: 1px solid #7d5294;
      border-radius: 12px;
      pointer-events: none;
    }

    .modal-info { padding: 9px 3px 2px; }

    .modal-name-ar {
      margin: 0;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.6;
    }

    .modal-name-en {
      margin-top: 2px;
      color: #c0a9d6;
      font-family: Arial, sans-serif;
      font-size: 12px;
      direction: ltr;
      text-align: right;
    }

    .modal-details {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      color: #e7dcef;
      background: #1a1324;
      border: 1px solid #352541;
      border-radius: 11px;
      font-size: 10px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .detail-row i {
      flex: 0 0 17px;
      margin-top: 4px;
      color: var(--pink);
      text-align: center;
    }

    .detail-row span { min-width: 0; }

    .modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 15px;
    }

    .modal-actions > * { flex: 1; }

    .modal-secondary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px;
      color: #e8d8f8;
      background: #20172b;
      border: 1px solid #473353;
      border-radius: 11px;
      font-size: 11px;
      cursor: pointer;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px 15px 28px;
      color: #8b8099;
      border-top: 1px solid #292032;
      text-align: center;
      font-size: 10px;
      line-height: 2.2;
    }

    .footer-brand { color: #e0c2ff; font-weight: 800; }

    .back-top {
      position: fixed;
      z-index: 90;
      left: 16px;
      bottom: 18px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: #fff;
      background: #21172eeb;
      border: 1px solid #59416c;
      border-radius: 14px;
      box-shadow: 0 5px 20px #0005;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s, visibility .25s;
      cursor: pointer;
    }

    .back-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    @media (max-width: 620px) {
      .top-banner { padding: 10px 0; }
      .brand { gap: 9px; font-size: 20px; }

      .brand-heart {
        width: 35px;
        height: 35px;
        font-size: 15px;
        border-radius: 11px;
      }

      .container { padding-top: 74px; }
      .search-wrap { margin: 12px 0 17px; }
      .main-search { padding: 12px; }
      .main-search input { font-size: 11px; }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .toolbar-side {
        width: 100%;
        justify-content: space-between;
      }

      #countryFilter { max-width: 65%; }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px 11px;
      }

      .card { border-radius: 13px; }
      .card-info { padding: 9px 9px 11px; }
      .name-ar { font-size: 11px; }
      .name-en { font-size: 10px; }
      .country-badge { padding: 3px 5px; font-size: 8px; }
      .details-hint { font-size: 8px; }
      .details-icon { width: 26px; height: 26px; }
      .modal { padding: 13px; }
    }

    @media (max-width: 350px) {
      .brand { font-size: 18px; }
      .grid { gap: 14px 8px; }
      .card-info { padding: 8px; }
      .name-ar { font-size: 10px; }
      .modal-photo-wrap { width: 70%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    
/* قائمة اختيار الدولة - تصميم بنفسجي */
#countryFilter {
  appearance: none;
  -webkit-appearance: none;

  width: 190px;
  max-width: 100%;
  min-height: 42px;

  padding: 10px 14px 10px 38px;

  color: #f5eaff;
  background:
    linear-gradient(135deg, rgba(177, 138, 255, 0.12), rgba(240, 163, 237, 0.04)),
    #171020;

  border: 1px solid #594071;
  border-radius: 13px;

  font-family: "Alexandria", sans-serif;
  font-size: 11px;
  font-weight: 500;

  cursor: pointer;
  outline: none;

  box-shadow:
    0 4px 14px rgba(0, 0, 0, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.035);

  transition:
    border-color 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease,
    transform 0.2s ease;

  /* سهم مخصص */
  background-image:
    linear-gradient(45deg, transparent 50%, #e0c0ff 50%),
    linear-gradient(135deg, #e0c0ff 50%, transparent 50%),
    linear-gradient(135deg, rgba(177, 138, 255, 0.12), rgba(240, 163, 237, 0.04));

  background-position:
    20px 18px,
    25px 18px,
    0 0;

  background-size:
    5px 5px,
    5px 5px,
    100% 100%;

  background-repeat: no-repeat;
}

/* عند الضغط أو اختيار القائمة */
#countryFilter:focus,
#countryFilter:focus-visible {
  color: #ffffff;
  border-color: #c49aff;

  box-shadow:
    0 0 0 3px rgba(177, 138, 255, 0.14),
    0 0 22px rgba(177, 138, 255, 0.16);

  background-color: #21152f;
}

/* تأثير مرور الماوس */
@media (hover: hover) {
  #countryFilter:hover {
    border-color: #a77bdb;
    box-shadow: 0 0 16px rgba(177, 138, 255, 0.12);
  }
}

/* خيارات الدول */
#countryFilter option {
  color: #f5eaff;
  background: #171020;
  font-family: "Alexandria", sans-serif;
  font-size: 12px;
}

/* تنسيق الهاتف */
@media (max-width: 620px) {
  #countryFilter {
    width: auto;
    min-width: 155px;
    max-width: 70%;
    min-height: 40px;
    padding: 9px 12px 9px 34px;
    border-radius: 12px;
    font-size: 10px;

    background-position:
      16px 17px,
      21px 17px,
      0 0;
  }
}

/* قائمة الدول المخصصة */
.country-picker {
  position: relative;
  width: 190px;
  max-width: 70%;
  font-family: "Alexandria", sans-serif;
}

.country-trigger {
  width: 100%;
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  padding: 10px 12px;
  color: #f7edff;
  background: linear-gradient(135deg, #251632, #15101f);
  border: 1px solid #654584;
  border-radius: 13px;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 4px 18px #0003;
  transition: .25s ease;
}

.country-trigger:hover,
.country-picker.open .country-trigger {
  border-color: #c49aff;
  box-shadow: 0 0 18px #b18aff25;
}

.country-trigger .country-arrow {
  color: #d8baff;
  transition: transform .25s;
}

.country-picker.open .country-arrow {
  transform: rotate(180deg);
}

.country-menu {
  position: absolute;
  z-index: 150;
  top: calc(100% + 9px);
  right: 0;
  width: 100%;
  min-width: 205px;
  max-height: 280px;
  overflow-y: auto;
  padding: 7px;
  background: linear-gradient(160deg, #24152f, #100b19);
  border: 1px solid #654584;

  to { transform: scale(1.12); }

    transform: translate(15px, -43%);

    ];

    const $ = id => document.getElementById(id);

    let currentQuery = "";
    let visibleCount = PAGE_SIZE;
    let lastFocusedElement = null;

    const modal = $("detailsModal");

    /* إنشاء الجزيئات المتحركة */
    function createParticles() {
      const container = $("particles");
      const colors = ["#b18aff", "#e7a5ff", "#f0a3ed", "#8e75ff"];
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < 25; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.setProperty("--x", `${Math.random() * 100}%`);
        particle.style.setProperty("--size", `${2 + Math.random() * 3}px`);
        particle.style.setProperty("--duration", `${10 + Math.random() * 13}s`);
        particle.style.setProperty("--delay", `${-Math.random() * 20}s`);
        particle.style.setProperty("--drift", `${-45 + Math.random() * 90}px`);
        particle.style.setProperty("--opacity", `${0.25 + Math.random() * 0.55}`);
        particle.style.setProperty(
          "--particle-color",
          colors[Math.floor(Math.random() * colors.length)]
        );
        fragment.appendChild(particle);
      }

      container.appendChild(fragment);
    }

    function makeElement(tag, className = "", text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function normalize(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase()
        .replace(/[أإآ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/[ًٌٍَُِّْـ]/g, "")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    /* التحقق من الرابط قبل استخدامه */
    function getSafeHttpUrl(value) {
      if (!value || !String(value).trim()) return "";

      try {
        const url = new URL(String(value).trim());

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    /* تعبئة قائمة الدول */
    function fillCountries() {
      const select = $("countryFilter");
      const previousValue = select.value;

      select.replaceChildren(new Option("كل الدول", ""));

      const countries = [...new Set(
        actors.map(actor => actor.country).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ar"));

      countries.forEach(country => {
        select.add(new Option(country, country));
      });

      if (countries.includes(previousValue)) {
        select.value = previousValue;
      }
    }

    /* صورة الكرت أو صورة بديلة */
    function createPhoto(actor, className = "photo") {
      const fallback = () => {
        const placeholder = makeElement(
          "div",
          `${className} photo-placeholder`,
          actor.initials || "؟"
        );

        placeholder.setAttribute("role", "img");
        placeholder.setAttribute(
          "aria-label",
          `صورة ${actor.nameAr || actor.nameEn || ""} غير متاحة`
        );

        return placeholder;
      };

      const safeImage = getSafeHttpUrl(actor.image);

      if (!safeImage) return fallback();

      const photo = document.createElement("img");
      photo.className = className;
      photo.src = safeImage;
      photo.alt = actor.nameAr || actor.nameEn || "صورة";
      photo.loading = "lazy";
      photo.decoding = "async";
      photo.referrerPolicy = "no-referrer";

      photo.addEventListener("error", () => {
        if (photo.isConnected) photo.replaceWith(fallback());
      }, { once: true });

      return photo;
    }

    /* إضافة معلومة إلى نافذة التفاصيل */
    function addDetail(iconClass, label, value) {
      if (value === undefined || value === null || !String(value).trim()) {
        return;
      }

      const row = makeElement("div", "detail-row");
      const icon = makeElement("i", iconClass);
      icon.setAttribute("aria-hidden", "true");

      const text = makeElement("span", "", `${label}: ${value}`);
      row.append(icon, text);
      $("modalDetails").appendChild(row);
    }

    /* فتح نافذة التفاصيل */
    function openDetails(actor) {
      lastFocusedElement = document.activeElement;

      $("modalNameAr").textContent =
        actor.nameAr || actor.nameEn || "اسم غير متوفر";

      $("modalNameEn").textContent = actor.nameEn || "";

      const photo = $("modalPhoto");
      const placeholder = $("modalPhotoPlaceholder");
      const safeImage = getSafeHttpUrl(actor.image);

      photo.hidden = true;
      photo.removeAttribute("src");
      photo.onload = null;
      photo.onerror = null;

      placeholder.hidden = false;
      placeholder.textContent = actor.initials || "؟";

      if (safeImage) {
        photo.alt = actor.nameAr || actor.nameEn || "صورة";

        photo.onload = () => {
          photo.hidden = false;
          placeholder.hidden = true;
        };

        photo.onerror = () => {
          photo.hidden = true;
          placeholder.hidden = false;
          placeholder.textContent = actor.initials || "؟";
          photo.removeAttribute("src");
        };

        photo.src = safeImage;

        if (photo.complete && photo.naturalWidth > 0) {
          photo.hidden = false;
          placeholder.hidden = true;
        }
      }

      $("modalDetails").replaceChildren();

      addDetail("fa-solid fa-calendar-days", "تاريخ الميلاد", actor.birthday);
      addDetail("fa-solid fa-earth-americas", "الدولة", actor.country);

      if (Array.isArray(actor.aliases) && actor.aliases.length) {
        addDetail(
          "fa-solid fa-signature",
          "أسماء أخرى",
          actor.aliases.join("، ")
        );
      }

      const linkButton = $("modalOpenLink");
      const safeLink = getSafeHttpUrl(actor.link);

      if (safeLink) {
        linkButton.href = safeLink;
        linkButton.hidden = false;
      } else {
        linkButton.hidden = true;
        linkButton.removeAttribute("href");
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      $("modalClose").focus();
    }

    function closeDetails() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
        lastFocusedElement.focus();
      }
    }

    $("modalClose").addEventListener("click", closeDetails);
    $("modalDone").addEventListener("click", closeDetails);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeDetails();
    });

    modal.querySelector(".modal-panel").addEventListener("click", event => {
      event.stopPropagation();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closeDetails();
      }
    });

    /* إنشاء الكرت */
    function createCard(actor, index) {
      const card = makeElement("article", "card");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute(
        "aria-label",
        `عرض تفاصيل ${actor.nameAr || actor.nameEn || "الكرت"}`
      );
      card.style.animationDelay = `${Math.min(index * 35, 250)}ms`;

      const photoArea = makeElement("div", "card-photo-button");
      photoArea.appendChild(createPhoto(actor));
      card.appendChild(photoArea);

      const info = makeElement("div", "card-info");
      const nameRow = makeElement("div", "name-row");

      nameRow.appendChild(
        makeElement(
          "h2",
          "name-ar",
          actor.nameAr || actor.nameEn || "اسم غير متوفر"
        )
      );

      if (actor.country) {
        nameRow.appendChild(
          makeElement("span", "country-badge", actor.country)
        );
      }

      info.append(
        nameRow,
        makeElement("div", "name-en", actor.nameEn || "")
      );

      const bottom = makeElement("div", "card-bottom");
      const hint = makeElement("span", "details-hint", "اضغط لعرض التفاصيل");
      const iconBox = makeElement("span", "details-icon");
      iconBox.appendChild(makeElement("i", "fa-solid fa-arrow-left"));

      bottom.append(hint, iconBox);
      info.appendChild(bottom);
      card.appendChild(info);

      card.addEventListener("click", () => openDetails(actor));

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openDetails(actor);
        }
      });

      return card;
    }

    /* حالة عدم وجود نتائج */
    function showEmptyState(results) {
      const empty = makeElement("div", "empty");
      const iconBox = makeElement("div", "empty-icon");
      iconBox.appendChild(makeElement("i", "fa-solid fa-magnifying-glass"));

      empty.append(
        iconBox,
        makeElement("h2", "", "ما لقينا نتائج"),
        makeElement("p", "", "جرّب اسماً آخر أو اختَر دولة مختلفة.")
      );

      const requestUrl = getSafeHttpUrl(REQUEST_TELEGRAM_URL);

      if (requestUrl) {
        const request = makeElement("a", "request-btn");
        request.href = requestUrl;
        request.target = "_blank";
        request.rel = "noopener noreferrer";

        request.append(
          makeElement("i", "fa-brands fa-telegram"),
          makeElement("span", "", "طلب إضافة")
        );

        empty.appendChild(request);
      }

      results.appendChild(empty);
    }

    /* البحث والتصفية */
    function getFilteredActors() {
      const query = normalize(currentQuery);
      const words = query.split(" ").filter(Boolean);
      const selectedCountry = $("countryFilter").value;

      return actors.filter(actor => {
        const searchable = normalize([
          actor.nameAr,
          actor.nameEn,
          actor.country,
          actor.nationality,
          actor.birthday,
          ...(actor.aliases || []),
          ...(actor.tags || [])
        ].join(" "));

        const matchesQuery = words.every(word => searchable.includes(word));
        const matchesCountry =
          !selectedCountry || actor.country === selectedCountry;

        return matchesQuery && matchesCountry;
      });
    }

    /* تحديث زر عرض المزيد */
    function updateMoreButton(total, shown) {
      const button = $("showMore");
      const remaining = total - shown;

      button.hidden = remaining <= 0;

      $("moreText").textContent =
        `عرض المزيد + (${Math.min(PAGE_SIZE, remaining)})`;

      $("moreIcon").className = "fa-solid fa-plus";
      button.setAttribute("aria-label", "عرض 10 كروت إضافية");
    }

    /* عرض الكروت */
    function render() {
      const filtered = getFilteredActors();
      const results = $("results");

      results.replaceChildren();
      $("count").textContent = `النتائج: ${filtered.length}`;

      if (!filtered.length) {
        showEmptyState(results);
        updateMoreButton(0, 0);
        return;
      }

      // يعرض من القائمة حتى العدد الذي وصل إليه المستخدم
      const visibleActors = filtered.slice(0, visibleCount);
      const fragment = document.createDocumentFragment();

      visibleActors.forEach((actor, index) => {
        fragment.appendChild(createCard(actor, index));
      });

      results.appendChild(fragment);
      updateMoreButton(filtered.length, visibleActors.length);
    }

    /* كل ضغطة تضيف 10 كروت أخرى */
    $("showMore").addEventListener("click", () => {
      visibleCount += PAGE_SIZE;
      render();
    });

    /* عند البحث نرجع لأول 10 نتائج */
    $("mainSearch").addEventListener("input", () => {
      currentQuery = $("mainSearch").value;
      visibleCount = PAGE_SIZE;
      render();
    });

    /* عند تغيير الدولة نرجع لأول 10 نتائج */
    $("countryFilter").addEventListener("change", () => {
      visibleCount = PAGE_SIZE;
      render();
    });

    /* العودة إلى الأعلى */
    const backTop = $("backTop");
    let scrollTicking = false;

    function updateScrollUI() {
      backTop.classList.toggle("visible", window.scrollY > 250);
      scrollTicking = false;
    }

    window.addEventListener("scroll", () => {
      if (!scrollTicking) {
        window.requestAnimationFrame(updateScrollUI);
        scrollTicking = true;
      }
    }, { passive: true });

    backTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    $("brandHome").addEventListener("click", event => {
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* تشغيل الصفحة */
    createParticles();
    fillCountries();
    render();
    updateScrollUI();
  </script>
  
  
<script>
(() => {
  const banners = document.querySelectorAll('.zahra-cinema');

  if (!('IntersectionObserver' in window)) {
    banners.forEach(el => el.classList.add('is-visible'));
    return;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  banners.forEach(el => observer.observe(el));
})();
</script>
