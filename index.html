<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>مشغل الفيديو</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08090d;
  font-family: Arial, sans-serif;
}

.player-box {
  width: 100%;
  max-width: 950px;
  margin: 20px auto;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 10px 35px #0008;
}

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
}

.player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

@media(max-width:600px) {
  .player-box {
    margin: 0;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="player-box">
  <div class="player">
    <iframe
      src="https://player.mediadelivery.net/play/798682/545ae7fe-0cf3-47b9-9411-7a209555ee05"
      loading="lazy"
      allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>
  </div>
</div>

</body>
</html>
